name: chip-supergoal-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: chip-supergoal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11.9", "3.13.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Native aggregate suite
        run: python scripts/test.py

  shell-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install mandatory shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      - name: Shell syntax and style
        run: bash scripts/test.sh --shell-only

  aggregate:
    runs-on: ubuntu-24.04
    needs: [python-tests, shell-quality]
    if: ${{ always() }}
    steps:
      - name: Confirm required platform gates
        run: |
          if [[ "${{ needs.python-tests.result }}" != "success" ||
                "${{ needs.shell-quality.result }}" != "success" ]]; then
            echo "Required platform gate failed or was skipped" >&2
            exit 1
          fi
          echo "Ubuntu, native Windows, and shell-quality gates passed"
